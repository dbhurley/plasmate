name: Coverage Scorecard (JS)

on:
  schedule:
    # Weekly on Sundays at 06:45 UTC
    - cron: '45 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage_js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Run coverage suite (JS enabled)
        run: |
          mkdir -p artifacts
          ./target/release/plasmate coverage \
            --urls bench/top100.txt \
            --output artifacts/coverage-js.json \
            --timeout 15000 \
            --concurrency 1 \
            --js-heap-mb 512 \
            --worker-memory-mb 0 \
            --worker-output-kb 256 \
            --max-external-scripts 3 \
            --max-external-script-kb 64 \
            --max-external-total-kb 128 \
            --external-script-timeout-ms 2000 \
            --max 100

      - name: Upload JS coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-js-scorecard-${{ github.run_id }}
          path: artifacts/coverage-js.json
          if-no-files-found: warn
          retention-days: 14
