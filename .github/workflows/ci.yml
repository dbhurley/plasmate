name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum Rust 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install minimum Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
        with:
          toolchain: 1.88.0

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-1.88-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check default features at MSRV
        run: cargo check --workspace --locked

      - name: Check all features at MSRV
        run: cargo check --workspace --locked --all-features

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Setup Node (for CDP smoke test)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install smoke test deps
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: smoke
        run: npm ci

      - name: CDP smoke test (Puppeteer)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          PLASMATE_UNSAFE_ALLOW_PRIVATE_NETWORK: '1'
        run: |
          cargo build --release
          ./target/release/plasmate serve --protocol cdp --host 127.0.0.1 --port 9222 2>/dev/null &
          PID=$!
          sleep 1
          node smoke/puppeteer-smoke.mjs
          kill $PID

      - name: MCP smoke test
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          PLASMATE_BIN: ./target/release/plasmate
          MCP_SMOKE_RPC_TIMEOUT: '20'
          MCP_SMOKE_OVERALL_TIMEOUT: '120'
          PLASMATE_UNSAFE_ALLOW_PRIVATE_NETWORK: '1'
        run: python3 smoke/mcp-smoke.py

      - name: MCP smoke harness failure tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: python3 -m unittest smoke/test_mcp_smoke_harness.py

      - name: ES module smoke test
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          PLASMATE_BIN: ./target/release/plasmate
        run: python3 smoke/module-smoke.py

      - name: Throughput benchmark
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          PLASMATE_UNSAFE_ALLOW_PRIVATE_NETWORK: '1'
        run: |
          python3 bench/local_server.py 8765 &
          sleep 1
          ./target/release/plasmate throughput-bench 2>&1 | tee bench-results.txt
          kill $(lsof -ti:8765) 2>/dev/null || true

          # Extract sequential ms/page and fail if regression > 2x baseline
          MS_PER_PAGE=$(grep "Sequential:" bench-results.txt | grep -oP '[\d.]+ms/page' | grep -oP '[\d.]+')
          echo "Sequential throughput: ${MS_PER_PAGE}ms/page"
          # Baseline: 0.5ms/page on cached local pages. Fail if > 5ms (10x margin for CI variability)
          python3 -c "
          ms = float('${MS_PER_PAGE}')
          limit = 5.0
          print(f'  Result: {ms}ms/page (limit: {limit}ms)')
          if ms > limit:
              print(f'  REGRESSION: {ms}ms exceeds {limit}ms limit')
              exit(1)
          print('  PASS')
          "

  action-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.22'
          cache-dependency-path: sdk/go/go.mod

      - name: Install Python manifest dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            pytest pydantic langchain-core \
            -e packages/som-parser-python \
            -e sdk/python \
            -e integrations/browser-use \
            -e integrations/langchain

      - name: Install Node manifest dependencies
        run: |
          npm ci --prefix packages/som-parser-node
          npm ci --prefix sdk/node
          npm ci --prefix integrations/vercel-ai

      - name: Action manifest conformance
        run: ./scripts/action-manifest-conformance.sh --quick
