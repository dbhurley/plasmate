name: Coverage Scorecard

on:
  schedule:
    # Daily at 06:15 UTC
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Run coverage suite
        run: |
          mkdir -p artifacts
          # JS is disabled for the public scorecard until we raise V8 heap limits
          # and harden against fatal OOM on heavy sites.
          ./target/release/plasmate coverage \
            --urls bench/top100.txt \
            --output artifacts/coverage.json \
            --timeout 15000 \
            --concurrency 6 \
            --no-js \
            --no-external \
            --max 100

      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-scorecard-${{ github.run_id }}
          path: artifacts/coverage.json
          if-no-files-found: warn
          retention-days: 14
