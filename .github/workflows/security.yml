name: Dependency Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow trust policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate immutable action pins
        run: python3 scripts/check-workflow-action-pins.py

  rust:
    name: Rust advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        # Vulnerabilities fail. Non-vulnerability maintenance warnings remain
        # visible and are tracked in docs/SUPPLY-CHAIN.md rather than ignored.
        run: cargo audit --file Cargo.lock

  npm:
    name: npm audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory:
          - packages/som-parser-node
          - sdk/node
          - smoke
          - integrations/vercel-ai
          - website
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci --ignore-scripts
      - name: Audit production and development dependencies
        working-directory: ${{ matrix.directory }}
        run: |
          production_status=0
          development_status=0
          npm audit --omit=dev || production_status=$?
          npm audit || development_status=$?
          if (( production_status != 0 || development_status != 0 )); then
            echo "npm audit failed (production=$production_status, full=$development_status)" >&2
            exit 1
          fi

  python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: security/python-audit-requirements.lock
      - name: Verify dependency coverage
        run: |
          python -m unittest scripts/test_check_python_audit_input.py
          python scripts/check-python-audit-input.py
      - name: Install Python audit tools
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0 uv==0.11.28
      - name: Audit hashed multi-project dependency lock
        run: pip-audit --requirement security/python-audit-requirements.lock --disable-pip
      - name: Audit Python SDK uv.lock
        run: |
          uv export --project sdk/python --locked --format requirements-txt \
            --no-emit-project --output-file "$RUNNER_TEMP/sdk-python-requirements.txt"
          pip-audit --requirement "$RUNNER_TEMP/sdk-python-requirements.txt" --disable-pip

  go:
    name: Go vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # govulncheck 1.6.0 requires Go 1.25; the SDK remains compatible
          # with the go 1.21 language level declared in sdk/go/go.mod.
          go-version: '1.25'
          cache-dependency-path: sdk/go/go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Audit Go SDK
        working-directory: sdk/go
        run: govulncheck ./...
