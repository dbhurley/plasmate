version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule: &weekly
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule: *weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /sdk/go
    schedule: *weekly
    open-pull-requests-limit: 2
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /packages/som-parser-node
    schedule: *weekly
    open-pull-requests-limit: 2
    groups: &npm-groups
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /sdk/node
    schedule: *weekly
    open-pull-requests-limit: 2
    groups: *npm-groups

  - package-ecosystem: npm
    directory: /smoke
    schedule: *weekly
    open-pull-requests-limit: 2
    groups: *npm-groups

  - package-ecosystem: npm
    directory: /integrations/vercel-ai
    schedule: *weekly
    open-pull-requests-limit: 2
    groups: *npm-groups

  - package-ecosystem: npm
    directory: /website
    schedule: *weekly
    open-pull-requests-limit: 2
    groups: *npm-groups

  - package-ecosystem: pip
    directory: /sdk/python
    schedule: *weekly
    open-pull-requests-limit: 2
    groups: &pip-groups
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /packages/som-parser-python
    schedule: *weekly
    open-pull-requests-limit: 2
    groups: *pip-groups

  - package-ecosystem: pip
    directory: /integrations/browser-use
    schedule: *weekly
    open-pull-requests-limit: 2
    groups: *pip-groups

  - package-ecosystem: pip
    directory: /integrations/langchain
    schedule: *weekly
    open-pull-requests-limit: 2
    groups: *pip-groups

  - package-ecosystem: pip
    directory: /tools/awp-cdp-proxy
    schedule: *weekly
    open-pull-requests-limit: 2
    groups: *pip-groups

  - package-ecosystem: pip
    directory: /security
    schedule: *weekly
    open-pull-requests-limit: 2
    groups: *pip-groups
