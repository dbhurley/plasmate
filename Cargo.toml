[package]
name = "plasmate"
version = "0.5.1"
edition = "2021"
rust-version = "1.88"
description = "Browser engine for AI agents. 10-100x fewer tokens than raw HTML. V8 JS, CDP/Puppeteer compatible, MCP server."
license = "Apache-2.0"
repository = "https://github.com/plasmate-labs/plasmate"
homepage = "https://plasmate.app"
documentation = "https://docs.plasmate.app"
readme = "README.md"
keywords = ["browser", "headless", "llm", "ai-agent", "web-scraping"]
categories = ["web-programming", "development-tools", "command-line-utilities"]

[features]
default = []
plugins = ["wasmtime"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls-native-roots", "gzip", "brotli", "deflate", "stream", "http2", "charset", "blocking"] }
html5ever = "0.38"
markup5ever = "0.38"
markup5ever_rcdom = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.24"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "timeout"] }
futures-util = "0.3"
brotli = "8"
flate2 = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
fs2 = "0.4"
rand = "0.8"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# V8 JavaScript engine (Chrome's JS runtime, Rust bindings)
v8 = "=139.0.0"
# ICU 74 common data matching the ICU ABI embedded by v8 139.0.0. Keep this
# exact pin in lockstep with the V8 compatibility contract.
deno_core_icudata = "=0.74.0"

# Wasm plugin runtime (optional — enable with `--features plugins`)
wasmtime = { version = "36.0.7", optional = true, default-features = false, features = ["cranelift", "runtime", "std"] }

# Fast hashing for SOM cache keys
xxhash-rust = { version = "0.8", features = ["xxh3"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
thiserror = "2"
toml = "0.8"

# TLS configuration (direct rustls access for fingerprint tuning)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
wat = "1"
tower = { version = "0.5", features = ["util"] }
